<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rope Rescue</title>
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <h1>Rope Rescue</h1>
        <p class="instructions">
          Goal: collect green kits, rescue the pink survivor, then reach the exit.
          <kbd>A</kbd>/<kbd>D</kbd> move · <kbd>W</kbd>/<kbd>S</kbd> reel · click
          to grapple · <kbd>Space</kbd> jump/boost · <kbd>E</kbd> release ·
          <kbd>R</kbd> restart
        </p>
        <button id="restart" type="button">Restart</button>
      </header>
      <div class="canvas-wrap">
        <canvas id="game" width="960" height="540" aria-label="Rope Rescue game"></canvas>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
